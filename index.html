<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Canin Sampling Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --rc:#E2001A; --rc-d:#B00014; --rc-l:#FDECEE; --ink:#1d1d1f; --mute:#6b6f76; --line:#e7e8eb;
  --ok:#1f8a4c; --ok-l:#e7f5ec; --warn:#c98a00; --warn-l:#fff7e3; --bad:#c62828; --bad-l:#fdecec;
  --bg:#262626; --stage:#ffffff; --soft:#f6f4f2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);font-family:Roboto,system-ui,sans-serif;color:var(--ink);overflow-x:hidden}
.wrap{width:1280px;transform-origin:top left;position:absolute;left:0;top:0}
header{padding:26px 0 18px 0;display:flex;gap:14px;align-items:center}
.eyebrow{font-size:10px;letter-spacing:3px;color:#9a9a9a;margin-bottom:6px}
.brandrow{display:flex;align-items:center;gap:14px}
.crest{width:40px;height:40px;border-radius:50%;background:var(--rc);display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px;letter-spacing:.5px}
.htitle{font-size:28px;letter-spacing:4px;color:#fff;font-weight:400}
.htitle span{color:#8d8d8d}
.stage{background:var(--stage);border-radius:6px;height:760px;position:relative;overflow:hidden}
.cap{display:flex;gap:16px;align-items:baseline;margin:14px 0 10px;color:#ddd;min-height:40px}
.cap b{font-size:10px;letter-spacing:2px;color:var(--rc);background:#3a1c1f;padding:4px 8px;border-radius:3px;white-space:nowrap}
.cap h3{font-size:17px;font-weight:500;color:#fff}
.cap p{font-size:13px;color:#a9a9a9;margin-top:3px}
.steps{display:flex;gap:4px}
.steps button{flex:1;height:28px;border:0;background:#3a3a3a;color:#aaa;font:500 10px Roboto;border-radius:2px;cursor:pointer}
.steps button.done{background:#5a5a5a;color:#ddd}
.steps button.on{background:var(--rc);color:#fff}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-bottom:30px}
.nav button{background:#333;border:1px solid #555;color:#eee;font:500 12px Roboto;padding:8px 18px;border-radius:4px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.nav span{font:11px 'Roboto Mono';color:#777}

/* reveal */
.rv{opacity:0;transform:translateY(8px);animation:rin .45s ease forwards;animation-delay:var(--d,0s)}
@keyframes rin{to{opacity:1;transform:none}}
.pop{opacity:0;transform:scale(.85);animation:pop .4s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{opacity:1;transform:none}}

/* two-col layout */
.duo{display:flex;gap:40px;padding:28px 40px;height:100%;align-items:flex-start}
.phlabel{font-size:10px;letter-spacing:2px;color:var(--mute);text-align:center;margin-bottom:8px;font-weight:700}
.phlabel.pro{color:var(--rc)}
.phone{width:360px;height:680px;border-radius:44px;background:#111;padding:10px;box-shadow:0 20px 40px rgba(0,0,0,.18);flex:none}
.screen{width:100%;height:100%;border-radius:35px;overflow:hidden;background:#fff;position:relative;display:flex;flex-direction:column}
.sbar{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:12px;font-weight:700;flex:none}
.url{margin:0 12px 6px;background:#f1f2f4;border-radius:10px;height:32px;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:12px;color:#444;flex:none}
.url i{font-style:normal;color:var(--ok)}
.page{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}
.rchead{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.rchead .crest{width:30px;height:30px;font-size:9px}
.rchead b{font-size:13px;letter-spacing:1.5px;color:var(--rc)}
.rchead small{display:block;font-size:10px;color:var(--mute);letter-spacing:0;font-weight:400}
.pbody{padding:20px 20px;flex:1;display:flex;flex-direction:column}
.ptitle{font-size:22px;font-weight:700;line-height:1.2}
.psub{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.45}
.btn{background:var(--rc);color:#fff;border:0;border-radius:12px;height:50px;font:700 15px Roboto;width:100%;display:grid;place-items:center}
.btn.ghost{background:#fff;color:var(--rc);border:1.5px solid var(--rc)}
.mt{margin-top:auto}
.prog{display:flex;gap:4px;padding:10px 20px 0}
.prog span{flex:1;height:3px;border-radius:2px;background:#eee}
.prog span.on{background:var(--rc)}

/* right panel */
.panel{flex:1;border:3px solid var(--rc);border-radius:10px;height:704px;padding:26px 30px;display:flex;flex-direction:column;gap:12px;margin-top:22px;overflow:hidden}
.ph{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:4px}
.ph .ic{width:40px;height:40px;border-radius:50%;border:2px solid var(--rc);display:grid;place-items:center;color:var(--rc);font-size:18px}
.ph h2{font-size:20px;font-weight:700}
.ph small{font-size:12px;color:var(--mute)}
.ph .tag{margin-left:auto;font-size:10px;letter-spacing:1px;color:var(--mute);display:flex;gap:6px;align-items:center}
.ph .tag:before{content:"";width:7px;height:7px;border-radius:50%;background:#4caf50}
.chk{display:flex;gap:14px;align-items:center;padding:13px 16px;border-radius:8px;border:1px solid #cfe9d8;background:var(--ok-l)}
.chk .d{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.chk b{font-size:14px;display:block}
.chk small{font-size:12px;color:var(--mute)}
.chk.w{background:var(--warn-l);border-color:#f3dfa8}.chk.w .d{background:#e0a800}
.chk.x{background:var(--bad-l);border-color:#f3c5c5}.chk.x .d{background:var(--bad)}
.chk.n{background:#fff;border-color:var(--line)}.chk.n .d{background:#2b2b2b}
.note{background:#f5f6f8;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:13px;line-height:1.5;color:#333;display:flex;gap:12px}
.note b{color:var(--rc)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:6px 11px;border-radius:4px;background:#f0f0f0}
.pill.r{background:var(--rc-l);color:var(--rc-d)}.pill.g{background:var(--ok-l);color:#14603a}.pill.y{background:var(--warn-l);color:#7a5600}.pill.b{background:#e8eef8;color:#22406e}
.sec{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--rc);margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mono{font-family:'Roboto Mono',monospace}

/* scene */
.scene{position:absolute;inset:0;background:#f7f1ea}
.aisle{position:absolute;top:0;left:0;right:0;height:56px;background:#3b2a24;color:#fff;font-size:12px;letter-spacing:4px;font-weight:700;display:grid;place-items:center}
.floor{position:absolute;left:0;right:0;bottom:0;height:150px;background:#e4d9cd;border-top:3px solid #d4c6b6}
.shelf{position:absolute;right:30px;top:110px;width:190px;height:520px;background:#efe6dc;border-radius:6px;padding:14px 12px;display:flex;flex-direction:column;gap:22px}
.shelf .row{display:flex;gap:8px;align-items:flex-end;border-bottom:6px solid #d8cabb;padding-bottom:4px;height:76px}
.bag{width:32px;border-radius:4px 4px 2px 2px;background:var(--rc);position:relative}
.bag:after{content:"";position:absolute;left:5px;right:5px;top:30%;height:12px;background:#fff;border-radius:2px;opacity:.85}
.bag.g{background:#7a7a7a}.bag.b{background:#3a6ea5}.bag.o{background:#e67e22}
.stall{position:absolute;left:340px;top:150px;width:540px;height:480px}
.awn{height:70px;border-radius:8px 8px 0 0;background:repeating-linear-gradient(90deg,var(--rc) 0 44px,#fff 44px 88px);box-shadow:0 6px 0 #8f0012}
.poles{position:absolute;top:70px;left:20px;right:20px;height:220px;border-left:12px solid #3b2a24;border-right:12px solid #3b2a24}
.counter{position:absolute;bottom:0;left:-10px;right:-10px;height:190px;background:var(--rc);border-top:12px solid #fff;display:flex;align-items:center;justify-content:flex-end;padding-right:36px;gap:20px;color:#fff}
.counter .crest{width:84px;height:84px;font-size:15px;background:#fff;color:var(--rc);border:4px solid #fff}
.counter h1{font-size:28px;font-weight:900;letter-spacing:1px}
.counter p{font-size:13px;letter-spacing:4px;color:#ffd6db;font-weight:700;margin-top:4px}
.qrstand{position:absolute;left:40px;top:250px;width:170px;background:#fff;border:3px solid var(--rc);border-radius:10px;padding:12px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.qrstand b{font-size:11px;letter-spacing:1.5px;color:var(--rc);display:block;margin-bottom:8px}
.qrstand small{font-size:10px;color:var(--mute);display:block;margin-top:6px;line-height:1.35}
.qrstand:after{content:"";position:absolute;left:50%;bottom:-140px;width:10px;height:140px;margin-left:-5px;background:#bfb3a6}
.bubble{position:absolute;background:#fff;border:2px solid #3b2a24;border-radius:12px;padding:14px 16px;font-size:15px;font-weight:500;line-height:1.4;width:270px}
.bubble:after{content:"";position:absolute;bottom:-12px;left:40px;border:10px solid transparent;border-top-color:#3b2a24;border-bottom:0}
.sidecard{position:absolute;left:36px;top:190px;width:270px;background:#fff;border:3px solid var(--rc);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.sidecard h4{background:var(--rc);color:#fff;font-size:13px;letter-spacing:1.5px;text-align:center;padding:12px}
.sidecard ul{list-style:none;padding:14px 18px;display:flex;flex-direction:column;gap:9px;font-size:13px}
.sidecard li{display:flex;gap:10px;align-items:center}
.sidecard li i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--ok);flex:none}
.sidecard li.no i{background:#bbb}
.sidecard li.no{color:#999;text-decoration:line-through}
.walkin{animation:walk 2.2s ease-out forwards}
@keyframes walk{from{transform:translateX(420px)}to{transform:none}}

/* camera */
.cam{flex:1;background:#0d0d0d;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.vf{width:220px;height:220px;position:relative}
.vf:before,.vf:after{content:"";position:absolute;inset:0;border:4px solid #fff;border-radius:14px;clip-path:polygon(0 0,30% 0,30% 4px,4px 4px,4px 30%,0 30%,0 70%,4px 70%,4px calc(100% - 4px),30% calc(100% - 4px),30% 100%,70% 100%,70% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 70%,100% 70%,100% 30%,calc(100% - 4px) 30%,calc(100% - 4px) 4px,70% 4px,70% 0,100% 0,100% 100%,0 100%)}
.scanline{position:absolute;left:8px;right:8px;height:3px;background:var(--rc);box-shadow:0 0 12px var(--rc);animation:scan 1.6s ease-in-out infinite alternate;top:10px}
@keyframes scan{to{top:calc(100% - 13px)}}
.toast{position:absolute;bottom:90px;left:20px;right:20px;background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.toast b{display:block}

/* face */
.oval{width:230px;height:290px;border-radius:50%;position:relative;overflow:hidden;background:#cdd5dd}
.ring{position:absolute;inset:-8px;border-radius:50%;border:5px solid rgba(255,255,255,.25)}
.ring.go{border-color:var(--ok);transition:border-color .3s}
.mesh{position:absolute;inset:0;opacity:0;animation:rin .5s forwards;animation-delay:var(--d,0s)}

/* dialog */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:#fff;border-radius:16px;padding:20px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h5{font-size:15px;font-weight:500;line-height:1.4;margin:10px 0 14px}
.dlg .opt{display:block;text-align:center;padding:11px;border-radius:10px;font-size:14px;font-weight:500;margin-top:8px;background:#f1f2f4}
.dlg .opt.hl{background:#1a73e8;color:#fff}

/* inputs */
.field{border:2px solid var(--rc);border-radius:12px;height:56px;display:flex;align-items:center;padding:0 16px;font-size:22px;font-weight:500;margin-top:18px}
.caret{display:inline-block;width:2px;height:24px;background:var(--rc);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.kb{background:#d3d6dc;padding:8px 4px 14px;display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.kb span{background:#fff;border-radius:5px;height:40px;display:grid;place-items:center;font-size:15px;box-shadow:0 1px 0 #999}
.choice{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;margin-top:10px}
.choice.sel{border-color:var(--rc);background:var(--rc-l)}
.choice .em{font-size:24px}
.choice small{display:block;font-weight:400;color:var(--mute);font-size:11px}

/* promoter app */
.pro .sbar{background:#2b1d1a;color:#fff}
.prohead{background:#2b1d1a;color:#fff;padding:8px 18px 14px;display:flex;align-items:center;gap:10px}
.prohead .crest{width:30px;height:30px;font-size:9px}
.prohead b{font-size:14px}.prohead small{display:block;font-size:10px;color:#c7b9b4}
.prohead .stk{margin-left:auto;text-align:right;font-size:20px;font-weight:900;color:#ffb3bd}
.prohead .stk small{font-size:9px;letter-spacing:1px;font-weight:500}

/* qr */
.qr{display:grid;grid-template-columns:repeat(21,1fr);background:#fff}
.qr i{aspect-ratio:1}
.qr i.k{background:#111}

/* map */
.map{position:relative;border-radius:10px;overflow:hidden;background:#eef0e8;border:1px solid var(--line)}
.pulse{transform-origin:center;transform-box:fill-box;animation:pl 2s ease-out infinite}
@keyframes pl{from{transform:scale(.4);opacity:.8}to{transform:scale(1.6);opacity:0}}

/* bar */
.bar{height:8px;background:#eee;border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--rc);width:0;animation:fill 1.2s ease forwards;animation-delay:var(--d,0s)}
@keyframes fill{to{width:var(--w)}}
.vec{font-family:'Roboto Mono';font-size:11px;color:#555;background:#f5f6f8;border-radius:6px;padding:10px 12px;line-height:1.6;word-break:break-all}
.kpi{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{font-size:28px;font-weight:900;display:block}
.kpi small{font-size:11px;color:var(--mute);letter-spacing:.5px}
.final{position:absolute;inset:0;background:#faf7f4;padding:26px 34px}
.hero{background:linear-gradient(120deg,var(--rc),#8f0012);border-radius:16px;color:#fff;padding:28px 34px;display:flex;align-items:center}
.hero h1{font-size:30px;font-weight:900}
.hero p{font-style:italic;opacity:.85;margin-top:6px}
.hero button{margin-left:auto;background:#fff;color:var(--rc);border:0;border-radius:8px;padding:14px 26px;font:700 15px Roboto;cursor:pointer}
.fcards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.fc{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.04);height:500px;display:flex;flex-direction:column;gap:12px}
.fc .n{width:28px;height:28px;border-radius:50%;background:var(--rc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.fc h4{font-size:16px}
.fc p{font-size:13px;color:var(--mute);line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div>
      <div class="eyebrow">OFFLINE PROMOTER SAMPLING DEMO</div>
      <div class="brandrow"><div class="crest">RC</div><div class="htitle">ROYAL CANIN <span>— ZERO-PII PET STORE SAMPLING</span></div></div>
    </div>
  </header>
  <div class="stage" id="stage"></div>
  <div class="cap" id="cap"></div>
  <div class="steps" id="steps"></div>
  <div class="nav"><button id="prev">← Previous</button><span>← → keys · Home / End to jump</span><button id="next">Next →</button></div>
</div>

<script>
/* ---------- helpers ---------- */
const d = s => `data-d="${s}"`;
const statusBar = (dark) => `<div class="sbar" ${dark?'':''}><span>4:12</span><span>●●●● 5G 86%</span></div>`;
function qr(seed=7){ // deterministic pseudo QR with finder patterns
  let r=seed, out='';
  const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
  const finder=(x,y,ox,oy)=>{const a=x-ox,b=y-oy;if(a<0||b<0||a>6||b>6)return null;return (a===0||a===6||b===0||b===6||(a>=2&&a<=4&&b>=2&&b<=4))};
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){
    let f=finder(x,y,0,0);if(f===null)f=finder(x,y,14,0);if(f===null)f=finder(x,y,0,14);
    const inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
    const k = f!==null ? f : (!inF && rnd()>.52);
    out+=`<i class="${k?'k':''}"></i>`;
  }
  return `<div class="qr">${out}</div>`;
}
const rcHead = (sub='Free trial pack · Stall RC-07') => `<div class="rchead"><div class="crest">RC</div><div><b>ROYAL CANIN</b><small>${sub}</small></div></div>`;
const custPhone = (inner, url='sample.royalcanin-demo.in/rc07') => `
  <div><div class="phlabel">CUSTOMER'S PHONE · NO APP</div>
  <div class="phone"><div class="screen">${statusBar()}<div class="url"><i>🔒</i>${url}</div><div class="page">${inner}</div></div></div></div>`;
const proPhone = (inner, stock=212) => `
  <div><div class="phlabel pro">PROMOTER APP · RAHUL · STALL RC-07</div>
  <div class="phone"><div class="screen pro">${statusBar(1)}<div class="prohead"><div class="crest">RC</div><div><b>RC Promoter</b><small>Bandra West pet store · Stall RC-07</small></div><div class="stk"><span id="stk">${stock}</span><small>STOCK</small></div></div><div class="page">${inner}</div></div></div></div>`;
const panel = (icon,title,sub,body,tag='LIVE') => `<div class="panel"><div class="ph"><div class="ic">${icon}</div><div><h2>${title}</h2><small>${sub}</small></div><div class="tag">${tag}</div></div>${body}</div>`;
const chk = (t,s,cls='',delay=0,ic) => `<div class="chk ${cls} rv" ${d(delay)}><div class="d">${ic||(cls==='x'?'✕':cls==='w'?'…':cls==='n'?'i':'✓')}</div><div><b>${t}</b><small>${s}</small></div></div>`;
const prog = n => `<div class="prog">${[1,2,3,4].map(i=>`<span class="${i<=n?'on':''}"></span>`).join('')}</div>`;

/* ---------- illustrations ---------- */
const promoterSVG = `<svg width="130" height="200" viewBox="0 0 130 200"><circle cx="65" cy="45" r="30" fill="#a86b4a"/><path d="M35 40 Q65 0 95 40 Q90 22 65 18 Q40 22 35 40Z" fill="#2a1a12"/><path d="M15 200 Q15 95 65 88 Q115 95 115 200Z" fill="#E2001A"/><rect x="40" y="120" width="50" height="16" rx="3" fill="#fff"/><text x="65" y="132" font-size="9" font-family="Roboto" font-weight="700" fill="#E2001A" text-anchor="middle">PROMOTER</text></svg>`;

function mapSVG({w=560,h=300,fence=true,pins=[],you=true,dash=false}={}){
  const roads = `<g stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"><path d="M-10 ${h*.35} L${w+10} ${h*.25}"/><path d="M${w*.3} -10 L${w*.38} ${h+10}"/><path d="M${w*.7} -10 L${w*.62} ${h+10}"/><path d="M-10 ${h*.8} Q${w*.5} ${h*.6} ${w+10} ${h*.85}"/></g><g stroke="#e3e5dc" stroke-width="5" fill="none"><path d="M0 ${h*.55} L${w} ${h*.5}"/><path d="M${w*.5} 0 L${w*.48} ${h}"/><path d="M${w*.12} 0 L${w*.18} ${h}"/><path d="M${w*.88} 0 L${w*.84} ${h}"/></g><rect x="${w*.42}" y="${h*.05}" width="${w*.16}" height="${h*.16}" rx="6" fill="#d5e8c9"/><rect x="${w*.72}" y="${h*.58}" width="${w*.12}" height="${h*.14}" rx="6" fill="#d5e8c9"/><path d="M${w*.86} -10 Q${w*.95} ${h*.5} ${w+10} ${h*.4} L${w+10} -10Z" fill="#cfe3f0"/>`;
  const cx=w*.5, cy=h*.45;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${roads}
  ${fence?`<circle cx="${cx}" cy="${cy}" r="70" fill="rgba(226,0,26,.08)" stroke="#E2001A" stroke-dasharray="6 5" stroke-width="2"/><text x="${cx+52}" y="${cy-58}" font-size="11" fill="#B00014" font-family="Roboto" font-weight="700">50 m geofence</text>`:''}
  ${fence?`<g><rect x="${cx-11}" y="${cy-28}" width="22" height="22" rx="4" fill="#E2001A"/><text x="${cx}" y="${cy-13}" font-size="9" fill="#fff" text-anchor="middle" font-family="Roboto" font-weight="700">RC</text><path d="M${cx-5} ${cy-6} L${cx} ${cy} L${cx+5} ${cy-6}Z" fill="#E2001A"/></g>`:''}
  ${you?`<circle class="pulse" cx="${cx-28}" cy="${cy+18}" r="14" fill="#1a73e8"/><circle cx="${cx-28}" cy="${cy+18}" r="7" fill="#1a73e8" stroke="#fff" stroke-width="3"/>`:''}
  ${pins.map(p=>`<g><circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="rgba(226,0,26,.18)" stroke="#E2001A" stroke-width="1.5"/><circle cx="${p.x}" cy="${p.y}" r="4" fill="#E2001A"/><text x="${p.x}" y="${p.y+p.r+13}" font-size="10.5" text-anchor="middle" font-family="Roboto" fill="#333" font-weight="500">${p.l}</text></g>`).join('')}
  </svg>`;
}

/* ---------- engine ---------- */
let cur=0, timers=[];
const stage=document.getElementById('stage'), cap=document.getElementById('cap'), stepsEl=document.getElementById('steps');
stepsEl.innerHTML=S.map((_,i)=>`<button onclick="go(${i})">${String(i+1).padStart(2,'0')}</button>`).join('');
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i));
  timers.forEach(clearTimeout);timers=[];
  const st=S[cur];
  stage.innerHTML=st.r();
  stage.querySelectorAll('[data-d]').forEach(el=>el.style.setProperty('--d',el.dataset.d+'s'));
  cap.innerHTML=`<b>STEP ${cur+1}</b><div><h3>${st.t}</h3><p>${st.s}</p></div>`;
  [...stepsEl.children].forEach((b,k)=>b.className=k===cur?'on':k<cur?'done':'');
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===S.length-1;
  stage.querySelectorAll('[data-type]').forEach(el=>{
    const txt=el.dataset.type; let n=0;
    const tick=()=>{el.textContent=txt.slice(0,++n); if(n<txt.length) timers.push(setTimeout(tick,140));};
    timers.push(setTimeout(tick,+el.dataset.delay||0));
  });
  const ring=stage.querySelector('#ring'), lv=stage.querySelector('#lv');
  if(ring){timers.push(setTimeout(()=>{lv.textContent='Blink once…'},900));timers.push(setTimeout(()=>{lv.textContent='Turn your head slightly…'},1700));timers.push(setTimeout(()=>{ring.classList.add('go');lv.textContent='✓ Live person verified';},2600));}
  if(st.after) st.after();
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Home')go(0);if(e.key==='End')go(S.length-1);});
function fit(){const w=document.getElementById('wrap');const s=Math.min(1,(innerWidth-32)/1280);w.style.transform=`scale(${s})`;w.style.left=((innerWidth-1280*s)/2)+'px';}
addEventListener('resize',fit);fit();
go((parseInt(location.hash.slice(1))||1)-1);
</script>
