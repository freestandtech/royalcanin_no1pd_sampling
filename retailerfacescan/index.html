<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Canin Retailer Sampling</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend+Deca:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rc:#E2001A; --rc-d:#A8001A; --rc-l:#FFF0F1; --fs:#052762; --fs-2:#0B3A8C; --fs-l:#EAF1FD;
  --ink:#16181d; --mute:#6b7079; --line:#ECEAE6; --cream:#FBF7F2;
  --ok:#14804A; --ok-l:#EAF7EF; --warn:#B87800; --warn-l:#FFF7E3; --bad:#C62828; --bad-l:#FDEDED;
  --bg:#17181c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1000px 600px at 15% -10%,#1b4fb0 0%,#0B3A8C 35%,#052762 70%,#031a45 100%) fixed;font-family:Inter,system-ui,sans-serif;color:var(--ink);overflow-x:hidden;min-height:100vh}
.wrap{width:1280px;transform-origin:top left;position:absolute;left:0;top:0}
header{padding:24px 0 16px;display:flex;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:10px;letter-spacing:3px;color:#9fb6e6;margin-bottom:8px;font-weight:600}
.brandrow{display:flex;align-items:center;gap:14px}
.htitle{font-size:24px;color:#fff;font-weight:500;letter-spacing:-.2px}
.htitle span{color:#9fb6e6;font-weight:400}
.pw{display:flex;align-items:center;gap:10px;color:#8c8c93;font-size:11px;letter-spacing:1px}
.pw svg{height:22px;width:auto}
.stage{background:var(--cream);border-radius:18px;height:860px;position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.cap{display:flex;gap:16px;align-items:center;margin:16px 0 12px;min-height:44px}
.cap b{font-size:10px;letter-spacing:2px;color:#fff;background:var(--rc);padding:6px 10px;border-radius:999px;white-space:nowrap;font-weight:700}
.cap h3{font-size:17px;font-weight:700;color:#fff}
.cap p{font-size:13px;color:#a2a4ab;margin-top:3px}
.steps{display:flex;gap:4px;margin-top:18px}
.steps button{flex:1;height:8px;border:0;background:rgba(255,255,255,.14);border-radius:999px;cursor:pointer;transition:.25s}
.steps button.done{background:rgba(255,255,255,.42)}
.steps button.on{background:#fff;height:8px;box-shadow:0 0 12px rgba(255,255,255,.5)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-bottom:30px}
.nav button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#eee;font:600 13px Inter;padding:10px 20px;border-radius:999px;cursor:pointer}
.nav button#next{background:#fff;border-color:#fff;color:#052762}
.nav button:disabled{opacity:.3;cursor:default}
.nav span{font:12px Inter;color:#9fb6e6}

.rv{opacity:0;transform:translateY(10px);animation:rin .5s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rin{to{opacity:1;transform:none}}
.pop{opacity:0;transform:scale(.88);animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{opacity:1;transform:none}}
.mono{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.3px;font-weight:600}

/* layout */
.duo{display:flex;gap:36px;padding:26px 36px 26px 30px;height:100%;align-items:center;background:radial-gradient(700px 500px at 18% 50%,#fff 0%,var(--cream) 70%)}
.devlabel{font-size:10px;letter-spacing:2.5px;color:var(--mute);text-align:center;margin-bottom:10px;font-weight:700}

/* kiosk */
.kiosk{width:372px;flex:none;position:relative}
.kbody{background:linear-gradient(160deg,#0B3A8C,#052762 55%,#031a45);border-radius:34px;padding:30px 16px 0;box-shadow:0 30px 60px rgba(5,39,98,.28),inset 0 1px 0 rgba(255,255,255,.15);position:relative}
.kcam{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:44px;height:10px;border-radius:6px;background:#020c22;display:flex;align-items:center;justify-content:center;gap:6px}
.kcam i{width:6px;height:6px;border-radius:50%;background:#2c6bd8;box-shadow:0 0 6px #4c8cff}
.kscreen{background:#fff;border-radius:20px;height:540px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.kfoot{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.kfoot svg{height:20px;width:auto;opacity:.9}
.slot{width:150px;height:12px;border-radius:6px;background:#010818;box-shadow:inset 0 2px 3px #000,0 1px 0 rgba(255,255,255,.15)}
.nfc{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;color:#9fc0ff;font-size:20px}
.nfc.live{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(76,140,255,.25);background:rgba(76,140,255,.25)}}
.kbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;font-size:11px;color:var(--mute);border-bottom:1px solid var(--line)}
.kbar b{color:var(--ink);font-size:12px;display:flex;align-items:center;gap:8px}
.rcdot{width:22px;height:22px;border-radius:50%;background:var(--rc);color:#fff;font-size:8px;font-weight:800;display:grid;place-items:center;letter-spacing:.3px}
.kpage{flex:1;padding:22px 22px;display:flex;flex-direction:column;position:relative}
.kt{font-size:24px;font-weight:800;line-height:1.18;letter-spacing:-.3px}
.ks{font-size:13px;color:var(--mute);margin-top:8px;line-height:1.5}
.btn{width:100%;background:var(--rc);color:#fff;border-radius:14px;height:52px;font-weight:700;font-size:15px;display:grid;place-items:center;box-shadow:0 8px 18px rgba(226,0,26,.25)}
.btn.ghost{background:#fff;color:var(--rc);border:1.5px solid var(--rc);box-shadow:none}
.mt{margin-top:auto}
.dots{display:flex;gap:5px;padding:12px 22px 0}
.dots span{flex:1;height:4px;border-radius:3px;background:#eee}
.dots span.on{background:var(--rc)}

/* card */
.card{width:300px;height:189px;border-radius:16px;position:relative;overflow:hidden;color:#fff;box-shadow:0 18px 40px rgba(120,0,15,.35);flex:none}
.card.front{background:radial-gradient(140% 120% at 0% 0%,#ff2b3f 0%,#E2001A 38%,#9c0014 100%)}
.card.front:before{content:"";position:absolute;right:-60px;top:-60px;width:230px;height:230px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.card.front:after{content:"";position:absolute;right:30px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.card .crest{position:absolute;left:20px;top:18px;display:flex;align-items:center;gap:9px}
.card .crest .c{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--rc);font-weight:800;font-size:9px;display:grid;place-items:center}
.card .crest b{font-size:13px;letter-spacing:2.5px;font-weight:800}
.card .crest small{display:block;font-size:8px;letter-spacing:1.5px;opacity:.8;font-weight:600}
.card .chip{position:absolute;left:22px;top:72px;width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#f4d58a,#c9a24a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.card .chip:after{content:"";position:absolute;inset:8px 6px;border:1px solid rgba(0,0,0,.25);border-radius:3px}
.card .wave{position:absolute;left:72px;top:76px;font-size:18px;opacity:.85}
.card .paw{position:absolute;right:22px;top:66px;font-size:46px;opacity:.95;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.card .id{position:absolute;left:22px;bottom:40px;font-family:Inter;font-size:15px;letter-spacing:2px}
.card .lbl{position:absolute;left:22px;bottom:18px;font-size:9px;letter-spacing:2px;opacity:.85;font-weight:700}
.card .fs{position:absolute;right:18px;top:24px;display:flex;align-items:center;gap:5px;font-size:7px;letter-spacing:1px;opacity:.85}
.card .fs svg{height:11px;width:auto}
.card.back{background:#fff;color:var(--ink);border:1px solid #eee}
.card.back .strip{position:absolute;left:0;right:0;top:20px;height:30px;background:#1d1d1f}
.card.back .qrw{position:absolute;right:18px;bottom:18px;width:84px;padding:5px;background:#fff;border:1px solid #eee;border-radius:6px}
.card.back .txt{position:absolute;left:18px;top:64px;right:120px;font-size:9.5px;line-height:1.55;color:#555}
.card.back .txt b{color:var(--rc);font-size:11px;display:block;margin-bottom:3px}

/* panel */
.panel{flex:1;background:#fff;border-radius:22px;height:690px;padding:26px 30px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(30,20,10,.08),0 0 0 1px var(--line);position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--rc),#ff6a3d)}
.ph{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:2px}
.ph .ic{width:44px;height:44px;border-radius:14px;background:var(--rc-l);display:grid;place-items:center;font-size:20px}
.ph h2{font-size:20px;font-weight:800;letter-spacing:-.2px}
.ph small{font-size:12px;color:var(--mute)}
.ph .tag{margin-left:auto;font-size:10px;letter-spacing:1.5px;color:var(--ok);display:flex;gap:6px;align-items:center;font-weight:700;background:var(--ok-l);padding:5px 10px;border-radius:999px}
.ph .tag:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blinkd 1.4s infinite}
@keyframes blinkd{50%{opacity:.3}}
.chk{display:flex;gap:14px;align-items:center;padding:12px 16px;border-radius:14px;background:var(--ok-l)}
.chk .d{width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;flex:none;font-weight:700}
.chk b{font-size:14px;display:block;font-weight:700}
.chk small{font-size:12px;color:var(--mute)}
.chk.w{background:var(--warn-l)}.chk.w .d{background:#e0a800}
.chk.x{background:var(--bad-l)}.chk.x .d{background:var(--bad)}
.chk.n{background:#f7f6f3}.chk.n .d{background:var(--fs)}
.note{background:linear-gradient(135deg,#fff7f7,#fff);border:1px solid #f6dadd;border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.55;color:#333;display:flex;gap:12px}
.note b{color:var(--rc)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;padding:6px 12px;border-radius:999px;background:#f2f1ee;font-weight:600}
.pill.r{background:var(--rc-l);color:var(--rc-d)}.pill.g{background:var(--ok-l);color:#0f5f37}.pill.y{background:var(--warn-l);color:#7a5600}.pill.b{background:var(--fs-l);color:var(--fs)}
.sec{font-size:10.5px;font-weight:800;letter-spacing:1.8px;color:var(--rc);margin-top:4px}
.kv{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{display:flex;padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}
.kv div:last-child{border-bottom:0}
.kv span{width:150px;color:var(--mute);flex:none}
.kv b{font-weight:700}

/* scene */
.scene{position:absolute;inset:0;background:linear-gradient(#f6efe6 0 74%,#e9dccd 74%)}
.wall{position:absolute;top:0;left:0;right:0;height:62px;background:#2b1d1a;color:#f4e8dc;font-size:11px;letter-spacing:4px;font-weight:700;display:grid;place-items:center}
.shelf{position:absolute;top:120px;height:430px;background:#efe3d4;border-radius:10px;padding:16px 14px;display:flex;flex-direction:column;gap:20px;box-shadow:inset 0 0 0 1px #e2d3c1}
.shelf .row{display:flex;gap:8px;align-items:flex-end;border-bottom:7px solid #d6c3ad;padding-bottom:4px;height:62px}
.bag{width:30px;border-radius:5px 5px 2px 2px;background:var(--rc);position:relative}
.bag:after{content:"";position:absolute;left:5px;right:5px;top:28%;height:10px;background:#fff;border-radius:2px;opacity:.9}
.bag.g{background:#8c8c8c}.bag.b{background:#3b6ea8}.bag.o{background:#e07a2c}.bag.k{background:#2b2b2b}
.kioskS{position:absolute;width:190px;z-index:3}
.kioskS .head{background:linear-gradient(160deg,#0B3A8C,#052762);border-radius:20px;padding:16px 10px 10px;box-shadow:0 20px 40px rgba(5,39,98,.3)}
.kioskS .scr{background:#fff;border-radius:10px;height:200px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.kioskS .scr b{font-size:13px;line-height:1.25}
.kioskS .scr small{font-size:9.5px;color:var(--mute)}
.kioskS .lg{display:flex;justify-content:center;padding:9px 0 3px}.kioskS .lg svg{height:13px;width:auto}
.kioskS .neck{width:34px;height:150px;margin:0 auto;background:linear-gradient(90deg,#031a45,#0B3A8C,#031a45)}
.kioskS .base{width:130px;height:16px;margin:0 auto;border-radius:8px;background:#031a45}
.bubble{position:absolute;background:#fff;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;line-height:1.45;box-shadow:0 12px 30px rgba(0,0,0,.1);z-index:6}
.bubble:after{content:"";position:absolute;bottom:-9px;left:36px;width:18px;height:18px;background:#fff;transform:rotate(45deg)}
.scard{position:absolute;background:#fff;border-radius:18px;box-shadow:0 18px 40px rgba(0,0,0,.1);overflow:hidden;z-index:6}
.scard h4{background:linear-gradient(90deg,var(--rc),#c40018);color:#fff;font-size:12px;letter-spacing:1.8px;padding:13px 18px;font-weight:800}
.scard ul{list-style:none;padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:13px}
.scard li{display:flex;gap:10px;align-items:center}
.scard li i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;background:var(--ok);flex:none;font-weight:700}
.scard li.no{color:#a0a0a0}.scard li.no i{background:#cfcfcf}
.walkin{animation:walk 2.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes walk{from{transform:translateX(360px);opacity:.2}to{transform:none;opacity:1}}
.signage{position:absolute;background:var(--rc);color:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 10px 24px rgba(226,0,26,.25)}

/* face cam */
.cam{flex:1;background:radial-gradient(circle at 50% 40%,#162a52,#050d1f);display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;position:relative}
.oval{width:220px;height:278px;border-radius:50%;position:relative;overflow:hidden;background:#cdd5dd}
.ring{position:absolute;inset:-9px;border-radius:50%;border:4px solid rgba(255,255,255,.2);transition:border-color .4s}
.ring.go{border-color:#3ddc84;box-shadow:0 0 30px rgba(61,220,132,.4)}
.mesh{opacity:0;animation:rin .5s forwards;animation-delay:var(--d,0s)}

/* dlg */
.dim{position:absolute;inset:0;background:rgba(10,15,30,.45);display:flex;align-items:center;justify-content:center;padding:22px;backdrop-filter:blur(2px)}
.dlg{background:#fff;border-radius:20px;padding:22px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dlg h5{font-size:15px;font-weight:700;line-height:1.4;margin:10px 0 6px}
.dlg p{font-size:12px;color:var(--mute);line-height:1.5;margin-bottom:10px}
.dlg .opt{display:block;text-align:center;padding:12px;border-radius:12px;font-size:14px;font-weight:700;margin-top:8px;background:#f1f2f4}
.dlg .opt.hl{background:var(--fs);color:#fff}

/* qr */
.qr{display:grid;grid-template-columns:repeat(21,1fr)}
.qr i{aspect-ratio:1}.qr i.k{background:#111}

/* map */
.map{position:relative;border-radius:14px;overflow:hidden;background:#eef0e8}
.pulse{transform-origin:center;transform-box:fill-box;animation:pl 2s ease-out infinite}
@keyframes pl{from{transform:scale(.4);opacity:.8}to{transform:scale(1.7);opacity:0}}
.bar{height:8px;background:#f0eeea;border-radius:4px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--rc),#ff5a48);width:0;animation:fill 1.2s ease forwards;animation-delay:var(--d,0s);border-radius:4px}
@keyframes fill{to{width:var(--w)}}
.vec{font-family:Inter;font-size:11px;color:#555;background:#f7f6f3;border-radius:12px;padding:12px 14px;line-height:1.6;word-break:break-all}

/* link diagram */
.link{display:flex;align-items:center;justify-content:space-between;gap:0;padding:6px 0}
.node{border-radius:16px;padding:14px;text-align:center;width:170px;background:#fff;box-shadow:0 0 0 1px var(--line),0 8px 20px rgba(0,0,0,.05)}
.node .ni{font-size:26px}
.node b{display:block;font-size:12px;margin-top:6px;letter-spacing:.5px;color:var(--mute);font-weight:700}
.node .v{font-family:Inter;font-size:12.5px;font-weight:600;margin-top:4px;color:var(--ink)}
.wire{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--rc) 0 6px,transparent 6px 11px);position:relative;opacity:0;animation:rin .3s forwards;animation-delay:var(--d,0s)}
.wire:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--rc);top:-3px;animation:travel 1.6s linear infinite}
@keyframes travel{from{left:0}to{left:calc(100% - 8px)}}

/* pos */
.pos{width:372px;flex:none}
.posb{background:linear-gradient(170deg,#2f3036,#18191d);border-radius:30px;padding:16px 14px 18px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.poss{background:#fff;border-radius:18px;height:600px;overflow:hidden;display:flex;flex-direction:column}
.posh{background:#1f2937;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.posh b{font-size:13px}
.line{display:flex;justify-content:space-between;font-size:13px;padding:7px 0}
.kpi{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 0 0 1px var(--line)}
.kpi b{font-size:26px;font-weight:800;display:block;letter-spacing:-.5px}
.kpi small{font-size:11px;color:var(--mute);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-size:10px;letter-spacing:1px;color:var(--mute);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:10px;border-bottom:1px solid #f3f1ed}
td.m{font-family:Inter;font-size:11px}
.final{position:absolute;inset:0;padding:26px 34px;background:var(--cream)}
.hero{background:radial-gradient(120% 140% at 0% 0%,#ff2b3f,#E2001A 40%,#7d0012);border-radius:22px;color:#fff;padding:30px 36px;display:flex;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"🐾";position:absolute;right:220px;top:-20px;font-size:140px;opacity:.08}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.5px}
.hero p{opacity:.9;margin-top:6px;font-size:15px}
.hero button{margin-left:auto;background:#fff;color:var(--rc);border:0;border-radius:999px;padding:14px 26px;font:800 14px Inter;cursor:pointer;position:relative;z-index:1}
.journey{display:flex;align-items:stretch;gap:0;margin-top:22px}
.jn{flex:1;background:#fff;border-radius:18px;padding:18px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:8px;min-height:300px}
.jn .n{width:52px;height:52px;border-radius:16px;background:var(--rc-l);display:grid;place-items:center}
.jn .n{font-size:28px}
.jn h4{font-size:14px;font-weight:800}
.jn p{font-size:12.5px;color:var(--mute);line-height:1.5}
.ja{width:18px;display:grid;place-items:center;color:var(--rc);font-weight:800;font-size:18px}

.fsapp{position:absolute;inset:0;display:flex;background:#F4F6FB}
.fsside{width:210px;background:linear-gradient(180deg,#052762,#031a45);color:#c9d6f2;padding:22px 16px;display:flex;flex-direction:column;gap:4px;flex:none}
.fsside .lg{padding:0 8px 22px}.fsside .lg svg{height:24px;width:auto}
.fsside .it{padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center}
.fsside .it.on{background:rgba(255,255,255,.12);color:#fff}
.fsside .cl{margin-top:auto;background:rgba(255,255,255,.07);border-radius:12px;padding:12px;font-size:11px;display:flex;gap:10px;align-items:center}
.fsmain{flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:14px;min-width:0}
.fstop{display:flex;align-items:center;gap:12px}
.fstop h2{font-size:20px;font-weight:800;color:#0b1b3f}
.fstop small{color:var(--mute);font-size:12px}
.fstop .flt{margin-left:auto;display:flex;gap:8px}
.fstop .flt span{background:#fff;border:1px solid #e3e8f2;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;color:#33415c}

function liveChart(){
  const cards=[96,118,142,188,171,214,236,208,259,288,271,305,322,296,281,318,341,366,389,357,338,379,402,431,456,438];
  const samp=cards.map((v,i)=>Math.round(v*(.95+((i*7)%5)/100)));
  const buy=cards.map((v,i)=>i===0?0:Math.round(cards[i-1]*(.24+((i*3)%7)/100)));
  const W=920,H=290,L=46,R=150,T=20,B=34,max=500,n=cards.length,gw=(W-L-R)/n,y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  [0,100,200,300,400,500].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#eef0f4"/><text x="${L-8}" y="${y(v)+4}" font-size="10" fill="#6b7280" text-anchor="end">${v}</text>`});
  cards.forEach((v,i)=>{const x=L+i*gw+gw*.18;
    g+=`<rect x="${x}" y="${y(v)}" width="${gw*.3}" height="${y(0)-y(v)}" fill="#4f6fd6"/><rect x="${x+gw*.32}" y="${y(samp[i])}" width="${gw*.3}" height="${y(0)-y(samp[i])}" fill="#8fd16b"/>`;
    g+=`<text x="${x+gw*.15}" y="${y(v)-4}" font-size="8.5" fill="#374151" text-anchor="middle">${v}</text>`;
    if(i%5===0){const dd=new Date(2026,9,20+i);g+=`<text x="${x+gw*.3}" y="${H-12}" font-size="10" fill="#6b7280" text-anchor="middle">${dd.getDate()} ${['Oct','Nov'][dd.getMonth()-9]}, 2026</text>`}});
  g+=`<polyline fill="none" stroke="#f2c94c" stroke-width="2" points="${buy.map((v,i)=>`${L+i*gw+gw*.48},${y(v)}`).join(' ')}"/>`+buy.map((v,i)=>`<circle cx="${L+i*gw+gw*.48}" cy="${y(v)}" r="2.6" fill="#fff" stroke="#f2c94c" stroke-width="1.5"/>`).join('');
  g+=[['#4f6fd6','Cards issued'],['#8fd16b','Samples'],['#f2c94c','Next-day purchases']].map(([c,t],k)=>`<rect x="${W-R+26}" y="${y(330)+k*22}" width="20" height="10" rx="2" fill="${c}"/><text x="${W-R+52}" y="${y(330)+k*22+9}" font-size="11" fill="#111827">${t}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:Inter">${g}</svg>`;
}

const kioskAt = (left,screen,red=false,chip='') => `<div class="kioskS" style="left:${left}px;top:150px">${chip?`<div style="position:absolute;top:-34px;left:0;right:0;text-align:center"><span style="background:${red?'#E2001A':'#052762'};color:#fff;font-size:10px;font-weight:800;letter-spacing:1.5px;padding:6px 12px;border-radius:999px">${chip}</span></div>`:''}<div class="head" ${red?'style="background:linear-gradient(160deg,#ff2b3f,#c40018)"':''}><div class="scr">${screen}</div><div class="lg">${FS_LOGO.replace('<svg','<svg style="height:13px;width:auto"')}</div><div style="display:flex;justify-content:space-between;align-items:center;padding:4px 18px 2px"><div class="slot" style="width:80px;height:7px"></div><div class="nfc" style="width:26px;height:26px;border-radius:8px;font-size:${red?11:9}px">${red?'💳':')))'}</div></div></div><div class="neck" ${red?'style="background:linear-gradient(90deg,#8a0014,#E2001A,#8a0014)"':''}></div><div class="base" ${red?'style="background:#8a0014"':''}></div></div>`;
function scene({customer=false,walk=false,bubble='',hold=false,card='',at='kiosk'}){
  const cardHTML = card==='how' ? `<div class="scard rv" style="left:36px;top:150px;width:285px" ${d(.3)}><h4>FREE SAMPLE · FACE SCAN ONLY</h4><ul>
      <li><i>1</i>Look at the camera at the face kiosk</li><li><i>2</i>Collect your Royal Canin card</li><li><i>3</i>Tap it at the Royal Canin counter</li><li><i>4</i>₹100 off your next purchase (from tomorrow)</li>
      <li class="no"><i>✕</i>No phone number</li><li class="no"><i>✕</i>No address</li><li class="no"><i>✕</i>No forms or permissions</li></ul></div>` : '';
  const face = kioskAt(380,`<div style="font-size:30px">🙂</div><b>Free Royal Canin card</b><small>Just look at the camera.<br>Nothing else to do.</small><div style="margin-top:auto;border:1.5px dashed #c9d3e6;color:#052762;border-radius:8px;font-size:10px;font-weight:800;padding:7px 10px;width:100%">👀 LOOK HERE</div>`,false,'① FACE KIOSK');
  const stn = counterScene(800);
  const cx = at==='station' ? 650 : 590;
  return `<div class="scene"><div class="wall">PETIQUE PET STORE · BANDRA WEST, MUMBAI · ENTRANCE → ROYAL CANIN AISLE</div>
    ${shelfHTML(1075,5)}
    <div style="position:absolute;left:740px;top:84px;font-size:10px;letter-spacing:2px;font-weight:800;color:#a08870">ROYAL CANIN AISLE →</div>
    ${face}${stn}
    ${bubble?`<div class="bubble rv" style="left:${at==='station'?600:610}px;top:110px;width:235px" ${d(.6)}>${bubble}</div>`:''}
    ${customer?`<div class="${walk?'walkin':''}" style="position:absolute;left:${cx}px;top:300px;display:flex;align-items:flex-end;z-index:5">${at==='station'?`<div style="margin-right:-20px;margin-bottom:-6px;transform:scaleX(-1)">${dogSVG}</div>`:''}${customerSVG(hold)}${at!=='station'?`<div style="margin-left:-20px;margin-bottom:-6px">${dogSVG}</div>`:''}</div>`:''}
    ${cardHTML}</div>`;
}

 for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=f(x,y,0,0);if(k===null)k=f(x,y,N-7,0);if(k===null)k=f(x,y,0,N-7);const inF=(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);out+=`<i class="${(k!==null?k:(!inF&&rnd()>.5))?'k':''}"></i>`}return `<div class="qr25">${out}</div>`}

const HEADS=[];
let cur=0, timers=[];
const stage=document.getElementById('stage'), cap=document.getElementById('cap'), stepsEl=document.getElementById('steps');
stepsEl.innerHTML=S.map((s,i)=>`<button title="${i+1}. ${s.t.replace(/"/g,'')}" onclick="go(${i})"></button>`).join('');
function go(i){
  cur=Math.max(0,Math.min(S.length-1,i)); timers.forEach(clearTimeout); timers=[];
  const st=S[cur]; POSE=st.pose||'stand'; STATION=!!st.station; stage.innerHTML=`<div class="shead"><span class="no">${String(cur+1).padStart(2,'0')}</span><div><h1>${HEADS[cur]||st.t}</h1><p>${st.s}</p></div>${cur===S.length-1?'<button class="rbtn" onclick="go(0)">↺ Restart demo</button>':''}</div><div class="sbody">${st.r()}</div>`;
  stage.querySelectorAll('[data-d]').forEach(el=>el.style.setProperty('--d',el.dataset.d+'s'));
  cap.innerHTML=`<b>STEP ${cur+1} / ${S.length}</b><div><p style="font-size:14px;color:#c4c6cc">${st.s}</p></div>`;
  [...stepsEl.children].forEach((b,k)=>b.className=k===cur?'on':k<cur?'done':'');
  document.getElementById('prev').disabled=cur===0; document.getElementById('next').disabled=cur===S.length-1;
  const ring=stage.querySelector('#ring'), lv=stage.querySelector('#lv');
  if(ring){timers.push(setTimeout(()=>{lv.textContent='Blink once…'},900));timers.push(setTimeout(()=>{lv.textContent='Turn your head slightly…'},1700));timers.push(setTimeout(()=>{ring.classList.add('go');lv.textContent='✓ Live person verified'},2600));}
  try{history.replaceState(null,'','#'+(cur+1))}catch(e){}
}
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);if(e.key==='Home')go(0);if(e.key==='End')go(S.length-1);});
// A phone browser stretches innerWidth/innerHeight to the unscaled 1280px slide (the demo then showed
// at near desktop size, cut off on the right), so measure the screen there instead. An upright phone
// gets the stacked 600px layout (html.phone) and a short screen (a phone on its side) fits the width
// and scrolls; anything larger fits the whole slide, as before.
function fit(){const de=document.documentElement,vw=innerWidth-de.clientWidth>100?de.clientWidth:innerWidth,vh=innerHeight-de.clientHeight>100?de.clientHeight:innerHeight;const phone=vw<760&&vh>vw,roll=phone||vh<520;de.classList.toggle('phone',phone);const W=phone?600:1280,w=document.getElementById('wrap');w.style.width=W+'px';const h=w.scrollHeight||1090;const s=roll?Math.min(1,(vw-(phone?16:32))/W):Math.min((vw-32)/1280,(vh-8)/h);w.style.transform=`scale(${s})`;w.style.left=((vw-W*s)/2)+'px';document.body.style.height=(h*s)+'px';document.body.style.minHeight='0';document.body.style.overflow=roll?'':'hidden';}
addEventListener('resize',fit);fit();
// stacked steps differ in height: on a phone, keep the page as tall as the step on screen
if(window.ResizeObserver)new ResizeObserver(()=>{if(document.body.style.overflow!=='hidden')fit();}).observe(document.getElementById('wrap'));
go((parseInt(location.hash.slice(1))||1)-1);
